<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ветер ТВ — Прямой Эфир</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #11141a;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .channel-header {
            margin-bottom: 25px;
            text-align: center;
        }

        .channel-title {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .channel-subtitle {
            font-size: 14px;
            color: #6c7a9c;
            margin-top: 6px;
        }

        .player-container {
            position: relative;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid #232936;
            background: #000;
            width: 800px;
            height: 450px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Защитный слой от кликов и перемотки зрителями */
        .player-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 40px);
            background: rgba(0,0,0,0);
            z-index: 10;
        }

        /* Экран профилактики / ночного отключения */
        .off-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 800px;
            height: 450px;
            background: #0d0f13;
            border-radius: 16px;
            border: 3px dashed #3a7bd5;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
        }

        .off-text {
            font-size: 24px;
            font-weight: 700;
            color: #6c7a9c;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="channel-header">
        <h1 class="channel-title">Ветер ТВ</h1>
        <div id="tv-subtitle" class="channel-subtitle">Синхронизация эфира...</div>
    </div>

    <!-- Основной рабочий плеер -->
    <div id="tv-wrapper" class="player-container">
        <div class="player-overlay"></div>
        <iframe id="main-player" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <!-- Заглушка ночного отключения -->
    <div id="static-screen" class="off-screen">
        <div class="off-text">🌙 Вещание окончено<br><span style="font-size: 14px; font-weight: 400; color: #434b5e; margin-top: 10px; display: block;">Эфир возобновится в 08:00</span></div>
    </div>

    <script>
        // Твоя фирменная заставка Ветер ТВ (11 секунд)
        const myIntroID = 'UbY3QIM69Ho';

        // 1. Блок СМЕШАРИКОВ (08:00 - 11:00)
        const smesharikiSchedule = [
            { id: 'AlR0fQsm83Y', duration: 5234, title: 'Смешарики. Начало (Полнометражный)' },
            { id: 'rXtaU_yitlQ', duration: 4210, title: 'Смешарики 2D — Большой сборник' }
        ];

        // 2. Блок ФИКСИКОВ (12:00 - 14:00)
        const fiksikiSchedule = [
            { id: 'V8Er1uk4fcw', duration: 3650, title: 'Фиксики — Огромный сборник серий' }
        ];

        // 3. Блок ПРОСТОКВАШИНО (14:00 - 16:00)
        const prostokvashinoSchedule = [
            { id: '-TX2qLecilw', duration: 2253, title: 'Новое Простоквашино — Сборник серий' }
        ];

        // 4. Блок ТРИ КОТА (17:00 - 19:00)
        const triKotaSchedule = [
            { id: 'uBNy9r6X5GI', duration: 3777, title: 'Три кота — Самый большой сборник (Часть 1)' },
            { id: 'BiDUGLoI90w', duration: 3841, title: 'Три кота — Самый большой сборник (Часть 2)' }
        ];

        // 5. ТЕХНИЧЕСКИЙ ПЕРЕРЫВ (20:00 - 21:00)
        const techBreakSchedule = [
            { id: '5qap5aO4i9A', duration: 3600, title: 'Технический перерыв // Музыкальная пауза (No Copyright)' }
        ];

        // 6. Блок ЛУНТИКА (21:00 - 21:55)
        const luntikSchedule = [
            { id: 'S7wU96O-C9Y', duration: 3300, title: 'Лунтик и его друзья — Вечерний сборник' }
        ];

        // 7. Настроечные ТВ-полосы (21:55 - 22:00)
        const tvLinesSchedule = [
            { id: 'XstLg_D038U', duration: 300, title: 'Технический перерыв перед отключением вещания' }
        ];

        // 8. ПЕТЯ И ВОЛК (Для всех остальных свободных часов, включая 11:00-12:00, 16:00-17:00, 19:00-20:00)
        const defaultSchedule = [
            { id: '9ZOzKUrzcPk', duration: 5642, title: 'Приключения Пети и Волка — Сборник серий' }
        ];

        function runLiveTv() {
            const player = document.getElementById('main-player');
            const subtitle = document.getElementById('tv-subtitle');
            const tvWrapper = document.getElementById('tv-wrapper');
            const staticScreen = document.getElementById('static-screen');
            
            const now = new Date();
            const currentHour = now.getHours(); 
            const currentMinute = now.getMinutes();
            const secondsToday = (now.getHours() * 3600) + (now.getMinutes() * 60) + now.getSeconds();

            // Полное ночное отключение эфира (с 22:01 до 07:59)
            if (currentHour >= 22 || currentHour < 8) {
                player.src = "";
                player.dataset.currentId = "";
                tvWrapper.style.display = "none";
                staticScreen.style.display = "flex";
                subtitle.innerText = "Телеканал отключен до утра";
                return;
            }

            tvWrapper.style.display = "block";
            staticScreen.style.display = "none";

            let activePlaylist = [];
            let currentLoopSecond = 0;

            // Распределение по временным зонам
            if (currentHour >= 8 && currentHour < 11) {
                activePlaylist = smesharikiSchedule;
                const secondsSinceStart = ((currentHour - 8) * 3600) + (now.getMinutes() * 60) + now.getSeconds();
                currentLoopSecond = secondsSinceStart % activePlaylist.reduce((sum, item) => sum + item.duration, 0);
            } 
            else if (currentHour >= 12 && currentHour < 14) {
                activePlaylist = fiksikiSchedule;
                const secondsSinceStart = ((currentHour - 12) * 3600) + (now.getMinutes() * 60) + now.getSeconds();
                currentLoopSecond = secondsSinceStart % activePlaylist.reduce((sum, item) => sum + item.duration, 0);
            } 
            else if (currentHour >= 14 && currentHour < 16) {
                activePlaylist = prostokvashinoSchedule;
                const secondsSinceStart = ((currentHour - 14) * 3600) + (now.getMinutes() * 60) + now.getSeconds();
                currentLoopSecond = secondsSinceStart % activePlaylist.reduce((sum, item) => sum + item.duration, 0);
            } 
            else if (currentHour >= 17 && currentHour < 19) {
                activePlaylist = triKotaSchedule;
                const secondsSinceStart = ((currentHour - 17) * 3600) + (now.getMinutes() * 60) + now.getSeconds();
                currentLoopSecond = secondsSinceStart % activePlaylist.reduce((sum, item) => sum + item.duration, 0);
            } 
            else if (currentHour >= 20 && currentHour < 21) {
                activePlaylist = techBreakSchedule;
                const secondsSinceStart = ((currentHour - 20) * 3600) + (now.getMinutes() * 60) + now.getSeconds();
                currentLoopSecond = secondsSinceStart % activePlaylist.reduce((sum, item) => sum + item.duration, 0);
            } 
            else if (currentHour === 21 && currentMinute < 55) {
                activePlaylist = luntikSchedule;
                const secondsSinceStart = (now.getMinutes() * 60) + now.getSeconds();
                currentLoopSecond = secondsSinceStart % activePlaylist.reduce((sum, item) => sum + item.duration, 0);
            }
            else if (currentHour === 21 && currentMinute >= 55) {
                activePlaylist = tvLinesSchedule;
                const secondsSinceStart = ((now.getMinutes() - 55) * 60) + now.getSeconds();
                currentLoopSecond = secondsSinceStart % activePlaylist.reduce((sum, item) => sum + item.duration, 0);
            }
            else {
                activePlaylist = defaultSchedule;
                currentLoopSecond = secondsToday % activePlaylist.reduce((sum, item) => sum + item.duration, 0);
            }

            // Ровно в начале каждого нового часа (в 17:00, 20:00, 21:00) пускаем твою заставку на 11 секунд!
            if (currentMinute === 0 && now.getSeconds() < 11) {
                const introLink = 'https://www.' + 'youtube' + '.com/embed/' + myIntroID + '?autoplay=1&mute=1&controls=0&rel=0';
                if (player.dataset.currentId !== myIntroID) {
                    player.src = introLink;
                    player.dataset.currentId = myIntroID;
                    subtitle.innerText = "В эфире: Фирменная заставка Ветер ТВ";
                }
                return;
            }

            let elapsedTime = 0;
            let currentVideo = activePlaylist;
            let startSeconds = 0;

            for (let i = 0; i < activePlaylist.length; i++) {
                if (currentLoopSecond >= elapsedTime && currentLoopSecond < elapsedTime + activePlaylist[i].duration) {
