<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ветер ТВ — Прямой Эфир</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #11141a;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .channel-header {
            margin-bottom: 25px;
            text-align: center;
        }

        .channel-title {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .channel-subtitle {
            font-size: 14px;
            color: #6c7a9c;
            margin-top: 6px;
        }

        .player-container {
            position: relative;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid #232936;
            background: #000;
            width: 800px;
            height: 450px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Защитный слой полностью закрывает видео */
        .player-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0);
            z-index: 10;
        }

        /* Панель управления */
        .controls-panel {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #1a1f29;
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid #232936;
        }

        /* Стили кнопок */
        .btn {
            background: #232936;
            color: #fff;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 20;
        }

        .volume-btn { border: 2px solid #00d2ff; }
        .volume-btn:hover {
            background: #00d2ff;
            color: #11141a;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
        }

        .fullscreen-btn { border: 2px solid #3a7bd5; }
        .fullscreen-btn:hover {
            background: #3a7bd5;
            box-shadow: 0 0 20px rgba(58, 123, 213, 0.4);
        }

        /* Контейнер регулятора громкости */
        .volume-slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            color: #00d2ff;
            font-size: 14px;
            margin-left: 5px;
            user-select: none;
        }

        /* Стилизация ползунка */
        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100px;
            height: 6px;
            border-radius: 3px;
            background: #232936;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #00d2ff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.6);
            transition: transform 0.1s;
        }

        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
    </style>
</head>
<body>

    <div class="channel-header">
        <h1 class="channel-title">Ветер ТВ</h1>
        <div id="tv-subtitle" class="channel-subtitle">Запуск трансляции...</div>
    </div>

    <div id="tv-wrapper" class="player-container">
        <div class="player-overlay"></div>
        <iframe id="main-player" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <div class="controls-panel">
        <button id="mute-button" class="btn volume-btn" onclick="toggleSound()">🔊 Включить звук</button>
        <button class="btn fullscreen-btn" onclick="toggleFullscreen()">📺 Во весь экран</button>
        
        <div class="volume-slider-container">
            <span>Громкость:</span>
            <input type="range" id="volume-input" class="volume-slider" min="0" max="10" value="8" oninput="changeVolume(this.value)">
            <span id="volume-val">8</span>
        </div>
    </div>

    <script>
        const myIntroID = 'UbY3QIM69Ho'; // Твоя заставка

        const marathonPlaylist = [
            { id: 'AlR0fQsm83Y', duration: 5234, title: 'Смешарики. Начало (Полнометражный)' },
            { id: '1vBgKm9qhhM', duration: 5133, title: 'Смешарики. Дежавю (Полнометражный)' },
            { id: 'xfFu4P2FZZc', duration: 4730, title: 'Смешарики. Легенда о золотом драконе (Полнометражный)' },
            { id: 'gs-MZg77o6w', duration: 5035, title: 'Смешарики снимают кино (Киноальманах)' }
        ];

        const totalMarathonDuration = marathonPlaylist.reduce((sum, item) => sum + item.duration, 0);
        let isMuted = true;
        let currentVolumeLevel = 80; 

        function runLiveTv() {
            const player = document.getElementById('main-player');
            const subtitle = document.getElementById('tv-subtitle');
            
            const now = new Date();
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();
            const currentSecond = now.getSeconds();
            
            if (currentHour >= 22 || currentHour < 8) {
                player.src = "";
                player.dataset.currentId = "";
                subtitle.innerText = "Телеканал отключен до утра";
                document.querySelector('.controls-panel').style.display = "none";
                return;
            }

            document.querySelector('.controls-panel').style.display = "flex";

            if (currentMinute === 0 && currentSecond < 11) {
                const introLink = 'https://www.' + 'youtube' + '.com/embed/' + myIntroID + '?autoplay=1&controls=0&rel=0&enablejsapi=1';
                if (player.dataset.currentId !== myIntroID) {
                    player.src = introLink;
                    player.dataset.currentId = myIntroID;
                    subtitle.innerText = "В эфире: Фирменная заставка Ветер ТВ";
                    setTimeout(applySoundState, 1000);
                }
                return;
            }

            // Считаем секунды строго от 08:00 утра
            const secondsSinceEightAm = ((currentHour - 8) * 3600) + (currentMinute * 60) + currentSecond;
            const currentLoopSecond = secondsSinceEightAm % totalMarathonDuration;

            let elapsedTime = 0;
            let currentVideo = marathonPlaylist;
            let startSeconds = 0;

            for (let i = 0; i < marathonPlaylist.length; i++) {
                if (currentLoopSecond >= elapsedTime && currentLoopSecond < elapsedTime + marathonPlaylist[i].duration) {
                    currentVideo = marathonPlaylist[i];
                    startSeconds = Math.floor(currentLoopSecond - elapsedTime);
                    break;
                }
                elapsedTime += marathonPlaylist[i].duration;
            }

            const youtubeEmbedLink = 'https://www.' + 'youtube' + '.com/embed/' + currentVideo.id + 
                                     '?autoplay=1&controls=0&rel=0&enablejsapi=1&start=' + startSeconds + '&mute=1';

            if (player.dataset.currentId !== currentVideo.id) {
                player.src = youtubeEmbedLink;
                player.dataset.currentId = currentVideo.id;
                subtitle.innerText = "В эфире: " + currentVideo.title;
                setTimeout(applySoundState, 1000);
            }
        }

        // ИСПРАВЛЕНО: Добавлены точные значения [currentVolumeLevel] и исправлен синтаксис postMessage
        function toggleSound() {
            const player = document.getElementById('main-player');
            const btn = document.getElementById('mute-button');
            const slider = document.getElementById('volume-input');
            const sliderVal = document.getElementById('volume-val');
            
            if (isMuted) {
                player.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
                player.contentWindow.postMessage('{"event":"command","func":"setVolume","args":[' + currentVolumeLevel + ']}', '*');
                btn.innerText = "🔇 Выключить звук";
                btn.style.borderColor = "#ff4a4a";
                isMuted = false;
                if (slider.value == 0) {
                    slider.value = 8;
                    sliderVal.innerText = 8;
                    currentVolumeLevel = 80;
                }
            } else {
                player.contentWindow.postMessage('{"event":"command","func":"mute","args":""}', '*');
                btn.innerText = "🔊 Включить звук";
                btn.style.borderColor = "#00d2ff";
                isMuted = true;
            }
        }

        // ИСПРАВЛЕНО: Полностью рабочий расчет уровней для шкалы от 1 до 10
        function changeVolume(val) {
            const player = document.getElementById('main-player');
            const btn = document.getElementById('mute-button');
