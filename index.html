<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ветер ТВ — Барбоскины Эфир</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #11141a;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .channel-header {
            margin-bottom: 25px;
            text-align: center;
        }

        .channel-title {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .channel-subtitle {
            font-size: 14px;
            color: #6c7a9c;
            margin-top: 6px;
        }

        .player-wrapper {
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid #232936;
            background: #000;
            line-height: 0;
            width: 800px;
            height: 450px;
            margin-bottom: 20px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .controls {
            display: flex;
            gap: 15px;
        }

        .btn {
            background: #232936;
            color: #fff;
            border: 2px solid #3a7bd5;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: #3a7bd5;
            box-shadow: 0 0 15px rgba(58, 123, 213, 0.4);
        }

        .btn-start {
            border-color: #00d2ff;
        }
        .btn-start:hover {
            background: #00d2ff;
            color: #11141a;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="channel-header">
        <h1 class="channel-title">Ветер ТВ</h1>
        <div id="tv-subtitle" class="channel-subtitle">Нажмите кнопку ниже, чтобы запустить телеканал</div>
    </div>

    <div class="player-wrapper">
        <iframe 
            id="main-player"
            allow="autoplay; encrypted-media" 
            allowfullscreen>
        </iframe>
    </div>

    <div class="controls">
        <!-- Главная кнопка старта эфира -->
        <button class="btn btn-start" onclick="startTv()">▶ Включить Ветер ТВ</button>
        <!-- Кнопка переключения заставки -->
        <button class="btn btn-intro" onclick="toggleStream()" style="display: none;">Включить заставку канала</button>
    </div>

    <script>
        const site = 'https://www.' + 'youtube' + '.com/embed/';
        const cartoonID = 'iVRbH_-Bdvo'; // Барбоскины
        const introID = '9bZkp7q19f0';   // Заставка
        
        let isIntro = false;
        let isStarted = false;
        const player = document.getElementById('main-player');
        const subtitle = document.getElementById('tv-subtitle');

        // Функция первого включения телевизора
        function startTv() {
            player.src = site + cartoonID + '?rel=0'; // Без автоплея, чистое включение по клику
            subtitle.innerText = "В эфире: Барбоскины (Выпуск 1)";
            
            // Показываем кнопку заставки и прячем кнопку старта
            document.querySelector('.btn-intro').style.display = 'inline-block';
            document.querySelector('.btn-start').style.display = 'none';
            isStarted = true;
        }

        // Переключение между мультфильмом и заставкой
        function toggleStream() {
            if (!isStarted) return;
            const button = document.querySelector('.btn-intro');

            if (!isIntro) {
                player.src = site + introID + '?rel=0';
                subtitle.innerText = "В эфире: Фирменная заставка Ветер ТВ";
                button.innerText = "Вернуть мультфильм";
                isIntro = true;
            } else {
                player.src = site + cartoonID + '?rel=0';
                subtitle.innerText = "В эфире: Барбоскины (Выпуск 1)";
                button.innerText = "Включить заставку канала";
                isIntro = false;
            }
        }
    </script>

</body>
</html>
