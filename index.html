<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВЕТЕР ТВ</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }

        h1 {
            color: #58a6ff;
            margin-top: 20px;
            margin-bottom: 5px;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .sub-title {
            color: #8b949e;
            font-size: 12px;
            margin-bottom: 25px;
        }

        .player-container {
            position: relative;
            width: 90%;
            max-width: 854px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #21262d;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background-color: #30363d;
            border-color: #8b949e;
            color: #ffffff;
        }

        /* Стили блока подвала (онлайн и чат) */
        .footer-block {
            width: 90%;
            max-width: 854px;
            text-align: center;
            margin-bottom: 40px;
        }

        .counter-box {
            padding: 15px;
            background: #161b22;
            border: 1px solid #21262d;
            border-radius: 8px;
            max-width: 350px;
            margin: 0 auto 25px auto;
        }

        .counter-title {
            color: #8b949e;
            font-size: 13px;
            margin: 0 0 8px 0;
            font-weight: bold;
            letter-spacing: 1px;
        }

        #online-counter {
            color: #3fb950;
            font-size: 26px;
            font-weight: bold;
            font-family: monospace;
        }

        .chat-title {
            color: #ffffff;
            margin-bottom: 12px;
            font-size: 15px;
            text-align: left;
            padding-left: 5px;
        }
    </style>
</head>
<body>

    <h1>ВЕТЕР ТВ</h1>
    <div class="sub-title" id="status-text">Запуск трансляции...</div>

    <!-- ТВОЙ ПЛЕЕР ЮТУБА С ЗАСТАВКОЙ -->
    <div class="player-container">
        <!-- Твоя заставка UbY3QIM69Ho подгрузится сразу с автозапуском -->
        <iframe id="tv-player" src="https://youtube.com" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <!-- ТВОИ РОДНЫЕ КНОПКИ УПРАВЛЕНИЯ -->
    <div class="controls">
        <button class="btn" onclick="toggleMute()">🔇 Включить звук</button>
        <button class="btn" onclick="goFullscreen()">📺 Во весь экран</button>
    </div>

    <!-- НОВЫЙ БЕЗОПАСНЫЙ ЧАТ И СЧЕТЧИК -->
    <div class="footer-block">
        
        <!-- ОДИН красивый счетчик онлайна -->
        <div class="counter-box">
            <p class="counter-title">🔴 СЕЙЧАС СМОТРЯТ ВЕТЕР ТВ:</p>
            <span id="online-counter">2</span>
        </div>

        <!-- Живой стабильный чат для зрителей -->
        <div class="chat-title">💬 ЧАТ ЭФИРА ВЕТЕР ТВ:</div>
        <iframe src="https://tlk.io" width="100%" height="350" style="border: 1px solid #21262d; border-radius: 12px; background: #0d1117;" frameborder="0"></iframe>

    </div>

    <script>
        let playerIframe = document.getElementById('tv-player');
        let statusBlock = document.getElementById('status-text');
        let isMuted = true;

        // Код кнопок звука и фуллскрина
        function toggleMute() {
            let btn = document.querySelector('.btn');
            if (isMuted) {
                playerIframe.src = playerIframe.src.replace('mute=1', 'mute=0');
                btn.innerHTML = "🔊 Выключить звук";
                isMuted = false;
            } else {
                playerIframe.src = playerIframe.src.replace('mute=0', 'mute=1');
                btn.innerHTML = "🔇 Включить звук";
                isMuted = true;
            }
        }

        function goFullscreen() {
            let container = document.querySelector('.player-container');
            if (container.requestFullscreen) container.requestFullscreen();
            else if (container.mozRequestFullScreen) container.mozRequestFullScreen();
            else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
            else if (container.msRequestFullscreen) container.msRequestFullscreen();
        }

        // Автоматическое обновление статуса трансляции
        setTimeout(function() {
            if(statusBlock) statusBlock.innerText = "В эфире: Смешарики Марафон 🍿";
        }, 3000);

        // Скрипт живого онлайна (без дублирования страниц)
        function simulateOnline() {
            let counter = document.getElementById('online-counter');
            if (!counter) return;
            let current = parseInt(counter.innerText);
            let change = Math.floor(Math.random() * 3) - 1; // -1, 0 или +1
            let newOnline = current + change;
            if (newOnline < 1) newOnline = 1;
            if (newOnline > 5) newOnline = 4;
            counter.innerText = newOnline;
        }
        setInterval(simulateOnline, 8000);
    </script>

</body>
</html>
