    <script>
        // ВРЕМЕННЫЙ ОЖИВЛЯЮЩИЙ СКРИПТ
        document.getElementById('onlineCount').textContent = "2";

        // ТВОЙ ПЛЕЙЛИСТ СМЕШАРИКОВ / ТРЕХ КОТОВ
        const playlist = [
            { id: 'AuMRLtc9o8E', title: '🛸 ТРИ КОТА 🛰️ Космические приключения 🌍', duration: 2960 }, 
            { id: 'wzNRYkrRxmk', title: '💰 ТРИ КОТА 🐾 Деловые КОТИКИ: Банковские серии 🏦💳', duration: 2974 }, 
            { id: 'du97gvD2MzA', title: '🚁 ТРИ КОТА 🧳 ✈️ Про самолёты ☁️', duration: 2696 }  
        ];
        
        const introId = 'UbY3QIM69Ho';
        const totalDuration = playlist.reduce((sum, item) => sum + item.duration, 0);
        let isMuted = true;

        const p1 = "https://www.";
        const p2 = "youtube";
        const p3 = ".com/";
        const p4 = "embed/";

        function updateLiveBroadcast() {
            const currentTimestamp = Math.floor(Date.now() / 1000);
            const now = new Date();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            
            const playerIframe = document.getElementById('tv-player');
            const muteParam = isMuted ? 1 : 0;

            if ((minutes === 0 || minutes === 30) && seconds < 11) {
                const introUrl = p1 + p2 + p3 + p4 + introId + `?autoplay=1&mute=${muteParam}&controls=0&enablejsapi=1`;
                if (playerIframe.src !== introUrl) {
                    playerIframe.src = introUrl;
                    document.getElementById('currentTrack').textContent = '📺 Заставка телеканала Ветер ТВ';
                }
                return;
            }

            let timeInCycle = currentTimestamp % totalDuration;
            let currentMovie = playlist;
            let startSeconds = 0;

            for (let i = 0; i < playlist.length; i++) {
                if (timeInCycle < playlist[i].duration) {
                    currentMovie = playlist[i];
                    startSeconds = Math.floor(timeInCycle);
                    break;
                }
                timeInCycle -= playlist[i].duration;
            }

            const movieUrl = p1 + p2 + p3 + p4 + currentMovie.id + `?autoplay=1&start=${startSeconds}&mute=${muteParam}&controls=0&enablejsapi=1`;
            
            if (playerIframe && !playerIframe.src.includes(currentMovie.id)) {
                playerIframe.src = movieUrl;
                document.getElementById('currentTrack').textContent = 'Сейчас в эфире: ' + currentMovie.title;
            }
        }

        updateLiveBroadcast();
        setInterval(updateLiveBroadcast, 1000);

        // УПРАВЛЕНИЕ ЗВУКОМ
        document.getElementById('muteBtn').addEventListener('click', function() {
            const playerIframe = document.getElementById('tv-player');
            isMuted = !isMuted;
            
            if (isMuted) {
                this.innerHTML = " Lumix 🔇 Включить звук";
                playerIframe.contentWindow.postMessage('{"event":"command","func":"mute","args":""}', '*');
            } else {
                this.innerHTML = "🔊 Выключить звук";
                playerIframe.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
            }
            updateLiveBroadcast();
        });

        // УПРАВЛЕНИЕ ПОЛНЫМ ЭКРАНОМ
        document.getElementById('fullscreenBtn').addEventListener('click', function() {
            const container = document.getElementById('videoContainer');
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => {
                    alert(`Ошибка перехода в полный экран: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        });
    </script>
