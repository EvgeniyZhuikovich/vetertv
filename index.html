<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ветер ТВ — Прямой эфир</title>
    <!-- Подключаем скрипт YouTube API асинхронно -->
    <script src="https://youtube.com" async></script>
    <style>
        /* Твой оригинальный темный стиль Ветер ТВ */
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #fff;
            font-size: 28px;
            margin-bottom: 5px;
            margin-top: 10px;
        }

        .subtitle {
            color: #38bdf8;
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        #broadcastStatus {
            font-size: 16px;
            color: #94a3b8;
            margin-bottom: 15px;
            font-weight: 500;
        }

        /* КОНТЕЙНЕР ПЛЕЕРА 16:9 — ИСПРАВЛЕННЫЙ СТИЛЬ */
        .video-container {
            width: 100%;
            max-width: 800px;
            position: relative;
            padding-bottom: 56.25%; /* Четкие пропорции экрана без искажений */
            height: 0;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        /* Стили для самого плеера внутри контейнера */
        #player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Кнопки управления под плеером */
        .controls-row {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 800px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            color: #fff;
        }

        #btnMuteToggle { background: #0ea5e9; }
        #btnMuteToggle:hover { background: #0284c7; }

        #btnFullscreen { background: #475569; }
        #btnFullscreen:hover { background: #334155; }

        button:active { transform: scale(0.98); }

        /* Онлайн счетчик */
        #onlineCounter {
            margin-top: 15px;
            font-size: 15px;
            color: #94a3b8;
        }
        #onlineCount {
            color: #22c55e;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Ветер ТВ</h1>
    <p class="subtitle">Прямой эфир</p>
    
    <div id="broadcastStatus">Загрузка эфира...</div>
    
    <!-- ИСПРАВЛЕННАЯ РАЗМЕТКА ПЛЕЕРА -->
    <div class="video-container">
        <div id="player"></div>
    </div>

    <div class="controls-row">
        <button id="btnMuteToggle">🔇 Включить звук</button>
        <button id="btnFullscreen">📺 Полный экран</button>
    </div>

    <div id="onlineCounter">👀 Онлайн: <span id="onlineCount">Загрузка...</span> чел.</div>

<script>
// НАСТРОЙКИ ЭФИРА 5 СЕЗОНА
const VIDEO_ID = 'ux79NJYKYHU'; // Твой ID видео со всем 5 сезоном
const VIDEO_DURATION = 13176;  // Длина видео в секундах (3ч 39мин 36сек)
let player = null;

// Инициализация YouTube API
window.onYouTubeIframeAPIReady = function() {
    const startSec = getLiveTimeOffset();

    player = new YT.Player('player', {
        videoId: VIDEO_ID,
        playerVars: {
            'autoplay': 1,
            'controls': 0, // Кастомные кнопки
            'mute': 1,     // Фикс автоплея для браузеров
            'start': startSec,
            'rel': 0,
            'modestbranding': 1
        },
        events: {
            'onReady': onPlayerReady,
            'onStateChange': onPlayerStateChange
        }
    });
};

function onPlayerReady(event) {
    document.getElementById('broadcastStatus').innerText = "🔴 ПРЯМОЙ ЭФИР: 5 СЕЗОН НИНДЗЯГО";
    event.target.playVideo();
    
    // Мягкая синхронизация времени раз в 5 секунд (без утечек памяти)
    setInterval(syncBroadcastTime, 5000);
}

function onPlayerStateChange(event) {
    if (event.data === YT.PlayerState.PAUSED) {
        player.playVideo();
    }
}

// Расчет секунды видео по времени суток
function getLiveTimeOffset() {
    const now = new Date();
    const secondsSinceMidnight = (now.getHours() * 3600) + (now.getMinutes() * 60) + now.getSeconds();
    return Math.floor(secondsSinceMidnight % VIDEO_DURATION);
}

// Мягкая корректировка времени
function syncBroadcastTime() {
    if (!player || typeof player.getCurrentTime !== 'function') return;
    
    const targetSeconds = getLiveTimeOffset();
    const currentSeconds = player.getCurrentTime();
    
    if (Math.abs(currentSeconds - targetSeconds) > 6) {
        player.seekTo(targetSeconds, true);
    }
}

// Кнопка звука
document.getElementById('btnMuteToggle').addEventListener('click', () => {
    if (!player) return;
    if (player.isMuted()) {
        player.unMute();
        document.getElementById('btnMuteToggle').innerText = "🔊 Выключить звук";
    } else {
        player.mute();
        document.getElementById('btnMuteToggle').innerText = "🔇 Включить звук";
    }
});

// Кнопка полного экрана
document.getElementById('btnFullscreen').addEventListener('click', () => {
    const iframe = document.getElementById('player');
    if (!iframe) return;
    
    if (iframe.requestFullscreen) { iframe.requestFullscreen(); }
    else if (iframe.mozRequestFullScreen) { iframe.mozRequestFullScreen(); }
    else if (iframe.webkitRequestFullscreen) { iframe.webkitRequestFullscreen(); }
    else if (iframe.msRequestFullscreen) { iframe.msRequestFullscreen(); }
});

// Автономный онлайн счетчик на BroadcastChannel
const syncChannel = new BroadcastChannel('vetertv_stream_net');
const myTabId = 'tab_' + Math.random().toString(36).substr(2, 9);
let activeTabs = new Set([myTabId]);

syncChannel.onmessage = function(event) {
    const msg = event.data;
    if (!msg) return;

    if (msg.type === 'PING') {
        syncChannel.postMessage({ type: 'PONG', id: myTabId });
        if (!activeTabs.has(msg.id)) {
            activeTabs.add(msg.id);
            updateOnlineUI();
        }
    } else if (msg.type === 'PONG') {
        if (!activeTabs.has(msg.id)) {
            activeTabs.add(msg.id);
            updateOnlineUI();
        }
    } else if (msg.type === 'CLOSE') {
        if (activeTabs.has(msg.id)) {
            activeTabs.delete(msg.id);
            updateOnlineUI();
        }
    }
};

function updateOnlineUI() {
    document.getElementById('onlineCount').innerText = activeTabs.size;
}

setInterval(() => {
    syncChannel.postMessage({ type: 'PING', id: myTabId });
}, 4000);

window.addEventListener('DOMContentLoaded', () => {
    updateOnlineUI();
    syncChannel.postMessage({ type: 'PING', id: myTabId });
});

window.addEventListener('beforeunload', () => {
    syncChannel.postMessage({ type: 'CLOSE', id: myTabId });
    syncChannel.close();
});
</script>
</body>
</html>
