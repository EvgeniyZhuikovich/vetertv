<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ветер ТВ — Прямой эфир</title>
    <style>
        /* ===== GLOBAL ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-main: #020617;
            --panel-bg: rgba(15, 23, 42, 0.45);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --text-main: #f8fafc;
        }

        body {
            background-color: var(--bg-main);
            background-image:
                radial-gradient(circle at 80% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 20% 80%, rgba(14, 165, 233, 0.15) 0%, transparent 50%);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ===== CINEMA GRID ===== */
        .cinema-grid {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 24px;
            width: 100%;
            max-width: 1150px;
        }

        @media (max-width: 900px) {
            .cinema-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ===== VIDEO SECTION ===== */
        .video-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .main-theater {
            position: relative;
            background: #000;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8), 0 0 50px var(--accent-glow);
            aspect-ratio: 16 / 9;
            overflow: hidden;
            width: 100%;
        }

        .main-theater iframe,
        .main-theater #yt-iframe-placeholder {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ===== SIDE DASHBOARD ===== */
        .side-dashboard {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .station-info h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 12px 0 0 0;
            background: linear-gradient(135deg, #fff 40%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge-live {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .pulse-ring {
            width: 6px;
            height: 6px;
            background: #ef4444;
            border-radius: 50%;
            animation: live-glow 1.5s infinite;
        }

        @keyframes live-glow {
            0%   { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70%  { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .meta-list {
            margin: 20px 0;
            padding: 0;
            list-style: none;
            font-size: 13px;
            color: #94a3b8;
        }

        .meta-list li {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            justify-content: space-between;
        }

        .meta-list strong {
            color: #f1f5f9;
        }

        .action-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-modern {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            padding: 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-modern:hover {
            background: rgba(56, 189, 248, 0.08);
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
        }

        .btn-glow {
            background: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%);
            border: none;
        }

        .btn-glow:hover {
            background: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
            color: #fff;
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.35);
        }
    </style>
</head>
<body>

    <div class="cinema-grid">
        <!-- ЛЕВАЯ КОЛОНКА: ПЛЕЕР -->
        <div class="video-section">
            <div class="main-theater" id="playerContainer"></div>
        </div>

        <!-- ПРАВАЯ КОЛОНКА: ИНФО + КНОПКИ -->
        <div class="side-dashboard">
            <div class="station-info">
                <div class="badge-live">
                    <div class="pulse-ring"></div>
                    Эфир
                </div>
                <h1>Ветер ТВ</h1>

                <ul class="meta-list">
                    <li>Сейчас в эфире: <strong id="currentShowTitle">Загрузка...</strong></li>
                    <li>Качество: <strong>Ultra HD 4K</strong></li>
                    <li>Онлайн: <strong><span id="onlineCount">Загрузка...</span> чел.</strong></li>
                </ul>
            </div>

            <div class="action-container">
                <button class="btn-modern btn-glow" id="mute-btn">🔊 Включить звук</button>
                <button class="btn-modern" id="fs-btn">📺 Полный экран</button>
            </div>
        </div>
    </div>

    <!-- ===== ПОДКЛЮЧАЕМ YOUTUBE IFRAME API ===== -->
    <script src="https://www.youtube.com/iframe_api">
    </script>

    <script>
        // ============================================================
        // 📋 ПЛЕЙЛИСТ — ДОБАВЛЯЙ ЛЮБЫЕ ID С ЮТУБА
        // ============================================================
        const playlist = [
            { id: 'Lu0pj1L6mL8', title: 'Смешарики НАЧАЛО' },
            { id: '1vBgKm9qhhM', title: 'Смешарики ДЕЖАВЮ' },
            { id: 'gs-MZg77o6w', title: 'Смешарики СНИМАЮТ КИНО' }
        ];

        // ============================================================
        // 🧠 ПЕРЕМЕННЫЕ
        // ============================================================
        let currentTrackIndex = 0;
        let isMuted = true;
        let player = null;
        let playerReady = false;

        // ============================================================
        // 🚀 СОЗДАНИЕ ПЛЕЕРА
        // ============================================================
        function onYouTubeIframeAPIReady() {
            playerReady = true;
            createPlayer();
        }

        function createPlayer() {
            if (!playerReady) return;

            const currentVideo = playlist[currentTrackIndex];
            document.getElementById('currentShowTitle').textContent = currentVideo.title;

            const container = document.getElementById('playerContainer');
            container.innerHTML = '<div id="yt-iframe-placeholder"></div>';

            player = new YT.Player('yt-iframe-placeholder', {
                height: '100%',
                width: '100%',
                videoId: currentVideo.id,
                playerVars: {
                    autoplay: 1,
                    controls: 1,
                    rel: 0,
                    mute: isMuted ? 1 : 0
                },
                events: {
                    onStateChange: onPlayerStateChange
                }
            });
        }

        // ============================================================
        // 🔄 АВТОПЕРЕКЛЮЧЕНИЕ ПОСЛЕ ОКОНЧАНИЯ
        // ============================================================
        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                currentTrackIndex++;
                if (currentTrackIndex >= playlist.length) {
                    currentTrackIndex = 0;
                }
                createPlayer();
            }
        }

        // ============================================================
        // 🔊 КНОПКА ЗВУКА
        // ============================================================
        document.getElementById('mute-btn').addEventListener('click', function() {
            if (player && typeof player.mute === 'function') {
                isMuted = !isMuted;
                if (isMuted) {
                    player.mute();
                    this.textContent = '🔊 Включить звук';
                } else {
                    player.unMute();
                    this.textContent = '🔇 Выключить звук';
                }
            }
        });

        // ============================================================
        // 📺 КНОПКА ПОЛНОГО ЭКРАНА
        // ============================================================
        document.getElementById('fs-btn').addEventListener('click', function() {
            const container = document.getElementById('playerContainer');
            if (container.requestFullscreen) {
                container.requestFullscreen();
            } else if (container.webkitRequestFullscreen) {
                container.webkitRequestFullscreen();
            }
        });

        // ============================================================
        // 🛡️ ЗАЩИТА ОТ F12 (ИНСТРУМЕНТЫ РАЗРАБОТЧИКА)
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && e.key === 'I') ||
                (e.ctrlKey && e.key === 'U')) {
                e.preventDefault();
                alert('Доступ к инструментам разработчика запрещён!');
            }
        });

        // ============================================================
        // 📡 ОНЛАЙН (ЗАГЛУШКА — ДЛЯ ТЕСТА)
        // ============================================================
        document.getElementById('onlineCount').textContent = '0';
    </script>

</body>
</html>
