<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ветер ТВ — Прямой Эфир</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #11141a;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .channel-header {
            margin-bottom: 25px;
            text-align: center;
        }

        .channel-title {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .channel-subtitle {
            font-size: 14px;
            color: #6c7a9c;
            margin-top: 6px;
        }

        .player-container {
            position: relative;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid #232936;
            background: #000;
            width: 800px;
            height: 450px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Защитный слой полностью закрывает видео */
        .player-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0);
            z-index: 10;
        }

        /* Контейнер для кнопок */
        .controls-panel {
            display: flex;
            gap: 15px;
        }

        /* Стили кнопок */
        .btn {
            background: #232936;
            color: #fff;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 20;
        }

        .volume-btn { border: 2px solid #00d2ff; }
        .volume-btn:hover {
            background: #00d2ff;
            color: #11141a;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
        }

        .fullscreen-btn { border: 2px solid #3a7bd5; }
        .fullscreen-btn:hover {
            background: #3a7bd5;
            box-shadow: 0 0 20px rgba(58, 123, 213, 0.4);
        }
    </style>
</head>
<body>

    <div class="channel-header">
        <h1 class="channel-title">Ветер ТВ</h1>
        <div id="tv-subtitle" class="channel-subtitle">Запуск трансляции...</div>
    </div>

    <div id="tv-wrapper" class="player-container">
        <div class="player-overlay"></div>
        <iframe id="main-player" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <div class="controls-panel">
        <button id="mute-button" class="btn volume-btn" onclick="toggleSound()">🔊 Включить звук</button>
        <button class="btn fullscreen-btn" onclick="toggleFullscreen()">📺 Во весь экран</button>
    </div>

    <script>
        const myIntroID = 'UbY3QIM69Ho'; // Твоя заставка

        // 4 проверенных полнометражных фильма
        const marathonPlaylist = [
            { id: 'AlR0fQsm83Y', duration: 5234, title: 'Смешарики. Начало (Полнометражный)' },
            { id: '1vBgKm9qhhM', duration: 5133, title: 'Смешарики. Дежавю (Полнометражный)' },
            { id: 'xfFu4P2FZZc', duration: 4730, title: 'Смешарики. Легенда о золотом драконе (Полнометражный)' },
            { id: 'gs-MZg77o6w', duration: 5035, title: 'Смешарики снимают кино (Киноальманах)' }
        ];

        const totalMarathonDuration = marathonPlaylist.reduce((sum, item) => sum + item.duration, 0);
        let isMuted = true;

        function runLiveTv() {
            const player = document.getElementById('main-player');
            const subtitle = document.getElementById('tv-subtitle');
            
            const now = new Date();
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();
            const currentSecond = now.getSeconds();
            
            if (currentHour >= 22 || currentHour < 8) {
                player.src = "";
                player.dataset.currentId = "";
                subtitle.innerText = "Телеканал отключен до утра";
                document.querySelector('.controls-panel').style.display = "none";
                return;
            }

            document.querySelector('.controls-panel').style.display = "flex";

            if (currentMinute === 0 && currentSecond < 11) {
                const introLink = 'https://www.' + 'youtube' + '.com/embed/' + myIntroID + '?autoplay=1&controls=0&rel=0&enablejsapi=1';
                if (player.dataset.currentId !== myIntroID) {
                    player.src = introLink;
                    player.dataset.currentId = myIntroID;
                    subtitle.innerText = "В эфире: Фирменная заставка Ветер ТВ";
                    setTimeout(applySoundState, 1000);
                }
                return;
            }

            // Считаем секунды строго от 08:00 утра
            const secondsSinceEightAm = ((currentHour - 8) * 3600) + (currentMinute * 60) + currentSecond;
            const currentLoopSecond = secondsSinceEightAm % totalMarathonDuration;

            let elapsedTime = 0;
            let currentVideo = marathonPlaylist;
            let startSeconds = 0;

            for (let i = 0; i < marathonPlaylist.length; i++) {
                if (currentLoopSecond >= elapsedTime && currentLoopSecond < elapsedTime + marathonPlaylist[i].duration) {
                    currentVideo = marathonPlaylist[i];
                    startSeconds = Math.floor(currentLoopSecond - elapsedTime);
                    break;
                }
                elapsedTime += marathonPlaylist[i].duration;
            }

            const youtubeEmbedLink = 'https://www.' + 'youtube' + '.com/embed/' + currentVideo.id + 
                                     '?autoplay=1&controls=0&rel=0&enablejsapi=1&start=' + startSeconds + '&mute=1';

            if (player.dataset.currentId !== currentVideo.id) {
                player.src = youtubeEmbedLink;
                player.dataset.currentId = currentVideo.id;
                subtitle.innerText = "В эфире: " + currentVideo.title;
                setTimeout(applySoundState, 1000);
            }
        }

        function toggleSound() {
            const player = document.getElementById('main-player');
            const btn = document.getElementById('mute-button');
            
            if (isMuted) {
                player.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
                player.contentWindow.postMessage('{"event":"command","func":"setVolume","args":[80]}', '*');
                btn.innerText = "🔇 Выключить звук";
                btn.style.borderColor = "#ff4a4a";
                isMuted = false;
            } else {
                player.contentWindow.postMessage('{"event":"command","func":"mute","args":""}', '*');
                btn.innerText = "🔊 Включить звук";
                btn.style.borderColor = "#00d2ff";
                isMuted = true;
            }
        }

        function applySoundState() {
            const player = document.getElementById('main-player');
            if (!isMuted && player && player.contentWindow) {
                player.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
                player.contentWindow.postMessage('{"event":"command","func":"setVolume","args":[80]}', '*');
            }
        }

        function toggleFullscreen() {
            const tvContainer = document.getElementById('tv-wrapper');
            if (!document.fullscreenElement) {
                if (tvContainer.requestFullscreen) { tvContainer.requestFullscreen(); }
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); }
            }
        }

        runLiveTv();
        setInterval(runLiveTv, 1000);
    </script>
<!-- НАЧАЛО ОБНОВЛЕННОГО СЧЁТЧИКА ОНЛАЙНА -->
<div style="text-align: center; margin-top: 30px; padding: 15px; background: #1a1a1a; border-radius: 8px; max-width: 400px; margin-left: auto; margin-right: auto; font-family: sans-serif;">
    <p style="color: #aaa; font-size: 14px; margin: 0 0 10px 0; font-weight: bold;">🔴 СЕЙЧАС СМОТРЯТ ВЕТЕР ТВ:</p>
    
    <!-- Сами живые цифры онлайна -->
    <span id="online-counter" style="color: #46d369; font-size: 24px; font-weight: bold; font-family: monospace;">1</span>

    <script>
        // Простой и надежный скрипт: генерирует случайных зрителей от 1 до 4, 
        // чтобы сайт не выглядел пустым, пока ты не подключился к большой базе данных.
        function simulateOnline() {
            let current = parseInt(document.getElementById('online-counter').innerText);
            let change = Math.floor(Math.random() * 3) - 1; // -1, 0 или +1
            let newOnline = current + change;
            if (newOnline < 1) newOnline = 1;
            if (newOnline > 5) newOnline = 4;
            document.getElementById('online-counter').innerText = newOnline;
        }
        // Обновляем цифру каждые 10 секунд
        setInterval(simulateOnline, 10000);
    </script>
    <!-- ПОДКЛЮЧАЕМ API ЮТУБА ДЛЯ НАШИХ КНОПОК -->
<script src="https://youtube.com"></script>

<!-- 1. VIP-ПАНЕЛЬ УПРАВЛЕНИЯ (СКРЫТА ПО УМОЛЧАНИЮ) -->
<div id="vip-control-panel" style="display: none; text-align: center; margin: 15px auto; max-width: 450px; font-family: sans-serif;">
    <p style="color: #ffeb3b; font-weight: bold; margin-bottom: 8px;">👑 ТВОЙ VIP-ПУЛЬТ УПРАВЛЕНИЯ:</p>
    <button onclick="rewindVip(-10)" style="background: #333; color: white; border: 1px solid #555; padding: 10px 15px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; margin: 0 3px;">⏪ -10 сек</button>
    <button id="vip-pause-btn" onclick="toggleVipPause()" style="background: #e50914; color: white; border: none; padding: 12px 25px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin: 0 3px; box-shadow: 0 0 10px rgba(229,9,20,0.5);">⏸ ПАУЗА</button>
    <button onclick="rewindVip(10)" style="background: #333; color: white; border: 1px solid #555; padding: 10px 15px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; margin: 0 3px;">+10 сек ⏩</button>
</div>

<!-- 2. СИСТЕМА ПРОФИЛЕЙ И РОЗЫГРЫША -->
<div id="vtv-premium-block" style="text-align: center; margin: 20px auto; padding: 15px; background: #1c1c1e; border: 2px solid #e50914; border-radius: 12px; max-width: 450px; font-family: sans-serif; color: white;">
    <div id="auth-zone">
        <p style="margin: 0 0 10px 0; font-size: 14px; color: #aaa;">Введи ник для участия в розыгрыше VIP-пульта:</p>
        <input type="text" id="user-nickname" placeholder="Твой ник в ТикТок" style="padding: 8px; border-radius: 6px; border: 1px solid #3a3a3c; background: #2c2c2e; color: white; width: 55%; margin-right: 5px;">
        <button onclick="saveVTVProfile()" style="background: #e50914; color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer;">Войти</button>
    </div>
    <div id="profile-zone" style="display: none; font-size: 16px; font-weight: bold; color: #46d369;"></div>
</div>

<!-- 3. ОКНО РУЛЕТКИ (ВСПЛЫВАЕТ НА ОНЛАЙНЕ 5) -->
<div id="roulette-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; text-align: center; font-family: sans-serif; color: white; padding-top: 150px;">
    <h1 style="color: #e50914; font-size: 36px; animation: blinker 1s linear infinite;">🚨 ОНЛАЙ延 ДОСТИГ 5 ЧЕЛОВЕК! 🚨</h1>
    <h2>Разыгрываем VIP-пульт управления...</h2>
    <div id="winner-scroll" style="font-size: 32px; font-weight: bold; color: #ffeb3b; margin: 40px 0;">[ Выбор зрителя... ]</div>
    <div id="roulette-result" style="font-size: 24px; color: #46d369; font-weight: bold;"></div>
</div>

<!-- 4. ЖИВОЙ ЧАТ ДЛЯ ВСЕХ ЗРИТЕЛЕЙ -->
<div style="text-align: center; margin: 25px auto; max-width: 854px; font-family: sans-serif;">
    <h3 style="color: white; margin-bottom: 10px; font-size: 16px; text-align: left; padding-left: 10px;">💬 ЧАТ ЭФИРА ВЕТЕР ТВ:</h3>
  <iframe src="https://cbox.ws" width="100%" height="320" style="border: 2px solid #333; border-radius: 8px; background: #141414;" frameborder="0" allowtransparency="yes" scrolling="auto"></iframe>

</div>

<script>
    let vtvPlayerInstance = null;

    // Автоматический перехват плеера YouTube для работы кнопок
    function onYouTubeIframeAPIReady() {
        let frame = document.getElementById('tv-player') || document.querySelector('iframe');
        if (frame) {
            if (!frame.src.includes('enablejsapi=1')) {
                frame.src += (frame.src.includes('?') ? '&' : '?') + 'enablejsapi=1';
            }
            vtvPlayerInstance = new YT.Player(frame);
        }
    }

    if (localStorage.getItem('vtv_username')) {
        showVTVProfile(localStorage.getItem('vtv_username'));
    }

    function saveVTVProfile() {
        let nick = document.getElementById('user-nickname').value.trim();
        if (!nick) { alert("Введи свой ник!"); return; }
        localStorage.setItem('vtv_username', nick);
        showVTVProfile(nick);
    }

    function showVTVProfile(nick) {
        document.getElementById('auth-zone').style.display = 'none';
        let pZone = document.getElementById('profile-zone');
        pZone.style.display = 'block';
        
        if (localStorage.getItem('vtv_is_vip') === 'true') {
            pZone.innerHTML = "👑 Привет, " + nick + "! У тебя активирован PREMIUM VIP-статус!";
            document.getElementById('vip-control-panel').style.display = 'block';
        } else {
            pZone.innerHTML = "🔴 " + nick + ", ты в игре! Чат открыт, ждем онлайн 5 для розыгрыша пульта...";
        }
    }

    // Функция Паузы / Воспроизведения
    function toggleVipPause() {
        if (!vtvPlayerInstance || typeof vtvPlayerInstance.getPlayerState !== 'function') return;
        let state = vtvPlayerInstance.getPlayerState();
        let btn = document.getElementById('vip-pause-btn');
        
        if (state === 1) { // 1 — видео играет
            vtvPlayerInstance.pauseVideo();
            btn.innerText = "▶️ ИГРАТЬ";
            btn.style.background = "#46d369";
            btn.style.boxShadow = "0 0 10px rgba(70,211,105,0.5)";
        } else {
            vtvPlayerInstance.playVideo();
            btn.innerText = "⏸ ПАУЗА";
            btn.style.background = "#e50914";
            btn.style.boxShadow = "0 0 10px rgba(229,9,20,0.5)";
        }
    }

    // Функция Перемотки назад и вперед
    function rewindVip(seconds) {
        if (!vtvPlayerInstance || typeof vtvPlayerInstance.getCurrentTime !== 'function') return;
        let currentTime = vtvPlayerInstance.getCurrentTime();
        vtvPlayerInstance.seekTo(currentTime + seconds, true);
    }

    // Авто-проверка счетчика онлайна для старта розыгрыша
    let rouletteTriggered = false;
    setInterval(function() {
        let counterBlock = document.getElementById('online-counter');
        if (counterBlock) {
            let currentOnline = parseInt(counterBlock.innerText);
            if (currentOnline >= 5 && !rouletteTriggered) {
                rouletteTriggered = true;
                startVipRoulette();
            }
        }
    }, 2000);

    function startVipRoulette() {
        document.getElementById('roulette-modal').style.display = 'block';
        let fakeUsers = ["Зритель_99", "TikTok_King", "МультФан", "Anon_VTV", localStorage.getItem('vtv_username') || "Гость"];
        let scrollBlock = document.getElementById('winner-scroll');
        let count = 0;
        
        let interval = setInterval(function() {
            scrollBlock.innerText = "🎲 " + fakeUsers[Math.floor(Math.random() * fakeUsers.length)] + " 🎲";
            count++;
            if (count > 15) {
                clearInterval(interval);
                let realUser = localStorage.getItem('vtv_username');
                let winner = realUser ? realUser : fakeUsers[Math.floor(Math.random() * fakeUsers.length)];
                
                scrollBlock.innerText = "🎉 ПОБЕДИТЕЛЬ: " + winner + " 🎉";
                
                if (winner === realUser) {
                    localStorage.setItem('vtv_is_vip', 'true');
                    document.getElementById('roulette-result').innerHTML = "Поздравляем! Ты выиграл ВИП-статус!<br><button onclick='location.reload()' style='margin-top:20px; padding:10px 20px; background:#46d369; border:none; border-radius:6px; font-weight:bold; cursor:pointer;'>ПОЛУЧИТЬ ПУЛЬТ</button>";
                } else {
                    document.getElementById('roulette-result').innerHTML = "В этот раз пульт забрал другой. Не уходи с трансляции!<br><button onclick='document.getElementById(\"roulette-modal\").style.display=\"none\"' style='margin-top:20px; padding:10px 20px; background:#555; border:none; border-radius:6px; color:white; cursor:pointer;'>Закрыть</button>";
                }
            }
        }, 200);
    }
</script>
