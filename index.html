<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ветер ТВ — Марафон Смешариков</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #11141a;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .channel-header {
            margin-bottom: 25px;
            text-align: center;
        }

        .channel-title {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .channel-subtitle {
            font-size: 14px;
            color: #6c7a9c;
            margin-top: 6px;
        }

        .player-container {
            position: relative;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid #232936;
            background: #000;
            width: 800px;
            height: 450px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* УМНЫЙ ОВЕРЛЕЙ: Закрывает видео от кликов, но оставляет 50px снизу для родного звука YouTube */
        .player-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 50px);
            background: rgba(0,0,0,0);
            z-index: 10;
        }

        /* Экран ночной профилактики */
        .off-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 800px;
            height: 450px;
            background: #0d0f13;
            border-radius: 16px;
            border: 3px dashed #3a7bd5;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
        }

        .off-text {
            font-size: 24px;
            font-weight: 700;
            color: #6c7a9c;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="channel-header">
        <h1 class="channel-title">Ветер ТВ</h1>
        <div id="tv-subtitle" class="channel-subtitle">Запуск трансляции...</div>
    </div>

    <!-- Основной рабочий плеер -->
    <div id="tv-wrapper" class="player-container">
        <div class="player-overlay"></div>
        <iframe id="main-player" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <!-- Заглушка ночного отключения -->
    <div id="static-screen" class="off-screen">
        <div class="off-text">🌙 Вещание окончено<br><span style="font-size: 14px; font-weight: 400; color: #434b5e; margin-top: 10px; display: block;">Эфир возобновится в 08:00</span></div>
    </div>

    <script>
        // Твоя фирменная заставка Ветер ТВ (11 секунд)
        const myIntroID = 'UbY3QIM69Ho';

        // 4 проверенных полнометражных фильма
        const marathonPlaylist = [
            { id: 'AlR0fQsm83Y', duration: 5234, title: 'Смешарики. Начало (Полнометражный)' },
            { id: '1vBgKm9qhhM', duration: 5133, title: 'Смешарики. Дежавю (Полнометражный)' },
            { id: 'xfFu4P2FZZc', duration: 4730, title: 'Смешарики. Легенда о золотом драконе (Полнометражный)' },
            { id: 'gs-MZg77o6w', duration: 5035, title: 'Смешарики снимают кино (Киноальманах)' }
        ];

        const totalMarathonDuration = marathonPlaylist.reduce((sum, item) => sum + item.duration, 0);

        function runLiveTv() {
            const player = document.getElementById('main-player');
            const subtitle = document.getElementById('tv-subtitle');
            const tvWrapper = document.getElementById('tv-wrapper');
            const staticScreen = document.getElementById('static-screen');
            
            const now = new Date();
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();
            const currentSecond = now.getSeconds();
            
            // 1. Ночное отключение эфира (с 22:01 до 07:59)
            if (currentHour >= 22 || currentHour < 8) {
                player.src = "";
                player.dataset.currentId = "";
                tvWrapper.style.display = "none";
                staticScreen.style.display = "flex";
                subtitle.innerText = "Телеканал отключен до утра";
                return;
            }

            tvWrapper.style.display = "block";
            staticScreen.style.display = "none";

            // 2. В первые 11 секунд абсолютно каждого нового часа запускаем твою заставку!
            if (currentMinute === 0 && currentSecond < 11) {
                const introLink = 'https://www.' + 'youtube' + '.com/embed/' + myIntroID + '?autoplay=1&mute=1&controls=1&rel=0';
                if (player.dataset.currentId !== myIntroID) {
                    player.src = introLink;
                    player.dataset.currentId = myIntroID;
                    subtitle.innerText = "В эфире: Фирменная заставка Ветер ТВ";
                }
                return;
            }

            // 3. Расчет текущей секунды эфира внутри марафона Смешариков
            const totalSecondsToday = (currentHour * 3600) + (currentMinute * 60) + currentSecond;
            const currentLoopSecond = totalSecondsToday % totalMarathonDuration;

            let elapsedTime = 0;
            let currentVideo = marathonPlaylist;
            let startSeconds = 0;

            for (let i = 0; i < marathonPlaylist.length; i++) {
                if (currentLoopSecond >= elapsedTime && currentLoopSecond < elapsedTime + marathonPlaylist[i].duration) {
                    currentVideo = marathonPlaylist[i];
                    startSeconds = Math.floor(currentLoopSecond - elapsedTime);
                    break;
                }
                elapsedTime += marathonPlaylist[i].duration;
            }

            // Включаем controls=1 (чтобы была видна полоска управления со звуком)
            const youtubeEmbedLink = 'https://www.' + 'youtube' + '.com/embed/' + currentVideo.id + 
                                     '?autoplay=1&mute=1&controls=1&rel=0&start=' + startSeconds;

            if (player.dataset.currentId !== currentVideo.id) {
                player.src = youtubeEmbedLink;
                player.dataset.currentId = currentVideo.id;
                subtitle.innerText = "В эфире: " + currentVideo.title;
            }
        }

        runLiveTv();
        setInterval(runLiveTv, 1000);
    </script>

</body>
</html>
