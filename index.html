<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ветер ТВ — Прямой Эфир</title>
    <!-- Подключаем YouTube API для управления звуком -->
    <script src="https://youtube.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #11141a;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .channel-header {
            margin-bottom: 25px;
            text-align: center;
        }

        .channel-title {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .channel-subtitle {
            font-size: 14px;
            color: #6c7a9c;
            margin-top: 6px;
        }

        .player-container {
            position: relative;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid #232936;
            background: #000;
            width: 800px;
            height: 450px;
            margin-bottom: 20px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Защитный слой намертво закрывает весь плеер */
        .player-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0);
            z-index: 10;
        }

        /* Кнопка включения звука */
        .volume-btn {
            background: #232936;
            color: #fff;
            border: 2px solid #00d2ff;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .volume-btn:hover {
            background: #00d2ff;
            color: #11141a;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="channel-header">
        <h1 class="channel-title">Ветер ТВ</h1>
        <div id="tv-subtitle" class="channel-subtitle">Синхронизация эфира...</div>
    </div>

    <div class="player-container">
        <!-- Оверлей защищает видео -->
        <div class="player-overlay"></div>
        <!-- Контейнер для API -->
        <div id="main-player"></div>
    </div>

    <!-- Наша личная кнопка для зрителей -->
    <button id="mute-button" class="volume-btn" onclick="toggleSound()">🔊 Включить звук</button>

    <script>
        let player;
        const myIntroID = 'UbY3QIM69Ho'; // Твоя заставка

        const marathonPlaylist = [
            { id: 'AlR0fQsm83Y', duration: 5234, title: 'Смешарики. Начало (Полнометражный)' },
            { id: '1vBgKm9qhhM', duration: 5133, title: 'Смешарики. Дежавю (Полнометражный)' },
            { id: 'xfFu4P2FZZc', duration: 4730, title: 'Смешарики. Легенда о золотом драконе (Полнометражный)' },
            { id: 'gs-MZg77o6w', duration: 5035, title: 'Смешарики снимают кино (Киноальманах)' }
        ];

        const totalMarathonDuration = marathonPlaylist.reduce((sum, item) => sum + item.duration, 0);

        // Функция запускается сама, когда YouTube API готово
        function onYouTubeIframeAPIReady() {
            // Рассчитываем стартовое видео и секунду до создания плеера
            const videoData = calculateCurrentVideo();

            player = new YT.Player('main-player', {
                height: '450',
                width: '800',
                videoId: videoData.video.id,
                playerVars: {
                    'autoplay': 1,
                    'mute': 1,       // Исходно без звука, чтобы браузер разрешил запуск
                    'controls': 0,   // Прячем интерфейс YouTube
                    'rel': 0,
                    'start': videoData.startSeconds
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        function onPlayerReady(event) {
            document.getElementById('tv-subtitle').innerText = "В эфире: " + calculateCurrentVideo().video.title;
            // Запускаем ежесекундную проверку сетки
            setInterval(checkBroadcastGrid, 1000);
        }

        // Логика расчета текущего видео на основе времени
        function calculateCurrentVideo() {
            const now = new Date();
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();
            const currentSecond = now.getSeconds();

            // Если время ночное (22:01 - 07:59), возвращаем заставку (хотя блок скрыт, для безопасности)
            if (currentHour >= 22 || currentHour < 8) {
                return { isIntro: false, video: marathonPlaylist[0], startSeconds: 0, isOff: true };
            }

            // Проверка заставки в начале часа
            if (currentMinute === 0 && currentSecond < 11) {
                return { isIntro: true, video: { id: myIntroID, title: 'Фирменная заставка Ветер ТВ' }, startSeconds: 0 };
            }

            const totalSecondsToday = (currentHour * 3600) + (currentMinute * 60) + currentSecond;
            const currentLoopSecond = totalSecondsToday % totalMarathonDuration;

            let elapsedTime = 0;
            let currentVideo = marathonPlaylist[0];
            let startSeconds = 0;

            for (let i = 0; i < marathonPlaylist.length; i++) {
                if (currentLoopSecond >= elapsedTime && currentLoopSecond < elapsedTime + marathonPlaylist[i].duration) {
                    currentVideo = marathonPlaylist[i];
                    startSeconds = Math.floor(currentLoopSecond - elapsedTime);
                    break;
                }
                elapsedTime += marathonPlaylist[i].duration;
            }

            return { isIntro: false, video: currentVideo, startSeconds: startSeconds };
        }

        // Ежесекундная проверка для смены фильмов и ночного отключения
        function checkBroadcastGrid() {
            const now = new Date();
            const currentHour = now.getHours();
            const subtitle = document.getElementById('tv-subtitle');
            const button = document.getElementById('mute-button');

            if (currentHour >= 22 || currentHour < 8) {
                player.stopVideo();
                document.getElementById('main-player').style.display = "none";
                button.style.display = "none";
                subtitle.innerText = "Телеканал отключен до утра (Ночная профилактика)";
                return;
            }

            const currentData = calculateCurrentVideo();
            const activeId = player.getVideoData().video_id;

            if (activeId !== currentData.video.id) {
                player.loadVideoById({
                    videoId: currentData.video.id,
                    startSeconds: currentData.startSeconds
                });
                subtitle.innerText = "В эфире: " + currentData.video.title;
            }
        }

        // Функция нашей кнопки «Включить звук»
        function toggleSound() {
            const btn = document.getElementById('mute-button');
            if (player && player.isMuted()) {
                player.unMute(); // Программное включение звука в обход оверлея!
                player.setVolume(80); // Ставим хорошую громкость
                btn.innerText = "🔇 Выключить звук";
                btn.style.borderColor = "#ff4a4a";
            } else if (player) {
                player.mute();
                btn.innerText = "🔊 Включить звук";
                btn.style.borderColor = "#00d2ff";
            }
        }
    </script>

</body>
</html>
