<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВЕТЕР ТВ</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }

        h1 {
            color: #58a6ff;
            margin-top: 20px;
            margin-bottom: 5px;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .sub-title {
            color: #8b949e;
            font-size: 13px;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .player-container {
            position: relative;
            width: 90%;
            max-width: 854px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #21262d;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background-color: #30363d;
            border-color: #8b949e;
            color: #ffffff;
        }

        .footer-block {
            width: 90%;
            max-width: 854px;
            text-align: center;
            margin-bottom: 40px;
        }

        .counter-box {
            padding: 15px;
            background: #161b22;
            border: 1px solid #21262d;
            border-radius: 8px;
            max-width: 350px;
            margin: 0 auto;
        }

        .counter-title {
            color: #8b949e;
            font-size: 13px;
            margin: 0 0 8px 0;
            font-weight: bold;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <h1>ВЕТЕР ТВ</h1>
    <div class="sub-title" id="status-text">Запуск эфира...</div>

    <!-- КОНТЕЙНЕР ПЛЕЕРА -->
    <div class="player-container">
        <iframe id="tv-player" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <!-- КНОПКИ УПРАВЛЕНИЯ -->
    <div class="controls">
        <button id="mute-btn" class="btn" onclick="toggleMute()">🔇 Включить звук</button>
        <button class="btn" onclick="goFullscreen()">📺 Во весь экран</button>
    </div>

    <!-- НАСТОЯЩИЙ СЧЕТЧИК ОНЛАЙНА -->
    <div class="footer-block">
        <div class="counter-box">
            <p class="counter-title">🔴 СЕЙЧАС СМОТРЯТ ВЕТЕР ТВ:</p>
            <a href="https://amung.us"><img src="https://amung.us" width="80" height="15" border="0" alt="real online"></a>
        </div>
    </div>

    <script>
        const myIntroID = 'UbY3QIM69Ho'; // Твоя заставка
        
        const marathonPlaylist = [
            { id: 'AlR0fQsm83Y', duration: 5234, title: 'Смешарики. Начало' },
            { id: 'xfFu4P2FZZc', duration: 4920, title: 'Смешарики. Легенда о золотом драконе' },
            { id: '1vBgKm9qhhM', duration: 5160, title: 'Смешарики. Дежавю' },
            { id: 'gs-MZg77o6w', duration: 5035, title: 'Смешарики снимают кино' }
        ];

        let playerIframe = document.getElementById('tv-player');
        let statusBlock = document.getElementById('status-text');
        let currentVideoID = myIntroID;
        let isMuted = true;
        let currentTrackIndex = 0;
        let isIntroPlaying = false;
        let movieTimeout = null;

        function startBroadcast() {
            playMovie(0);
            setInterval(checkHourlyIntro, 1000);
        }

        function playMovie(index) {
            if (isIntroPlaying) return; 
            if (index >= marathonPlaylist.length) index = 0; 
            currentTrackIndex = index;
            
            let movie = marathonPlaylist[index];
            currentVideoID = movie.id;
            
            if (statusBlock) statusBlock.innerText = "В эфире: " + movie.title + " 🍿";
            // ТУТ ЖЕСТКО ЗАКРЕПЛЕН СЛЭШ ПЕРЕД ID
            playerIframe.src = "https://youtube.com" + movie.id + "?autoplay=1&mute=" + (isMuted ? 1 : 0);
            
            if (movieTimeout) clearTimeout(movieTimeout);
            movieTimeout = setTimeout(function() {
                playMovie(currentTrackIndex + 1);
            }, movie.duration * 1000);
        }

        function checkHourlyIntro() {
            let now = new Date();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            if (minutes === 0 && seconds === 0 && !isIntroPlaying) {
                isIntroPlaying = true;
                if (movieTimeout) clearTimeout(movieTimeout); 

                if (statusBlock) statusBlock.innerText = "🚨 ЧАСОВОЙ ВЫПУСК: Заставка Ветер ТВ";
                currentVideoID = myIntroID;
                // ТУТ ТОЖЕ СЛЭШ ЗАКРЕПЛЕН
                playerIframe.src = "https://youtube.com" + myIntroID + "?autoplay=1&mute=" + (isMuted ? 1 : 0);

                setTimeout(function() {
                    isIntroPlaying = false;
                    playMovie(currentTrackIndex); 
                }, 11000); // 11 секунд заставки
            }
        }

        function toggleMute() {
            let btn = document.getElementById('mute-btn');
            isMuted = !isMuted;
            
            if (!isMuted) {
                btn.innerHTML = "🔊 Выключить звук";
            } else {
                btn.innerHTML = "🔇 Включить звук";
            }
            // ТУТ ТОЖЕ УБРАНА ОШИБКА СКЛЕИВАНИЯ
            playerIframe.src = "https://youtube.com" + currentVideoID + "?autoplay=1&mute=" + (isMuted ? 1 : 0);
        }

        function goFullscreen() {
            let container = document.querySelector('.player-container');
            if (container.requestFullscreen) container.requestFullscreen();
            else if (container.mozRequestFullScreen) container.mozRequestFullScreen();
            else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
            else if (container.msRequestFullscreen) container.msRequestFullscreen();
        }

        window.onload = startBroadcast;
    </script>

</body>
</html>
