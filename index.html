<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ветер ТВ — Прямой эфир</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            font-size: 3.5rem;
            margin-top: 10px;
            margin-bottom: 5px;
            color: #38bdf8;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            letter-spacing: 2px;
        }
        .live-badge {
            background-color: #ef4444;
            color: white;
            padding: 4px 10px;
            font-weight: bold;
            border-radius: 4px;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 10px;
            text-transform: uppercase;
            animation: blink 1.5s infinite;
        }
        @keyframes blink { 50% { opacity: 0.5; } }
        .subtitle { font-size: 1.2rem; color: #94a3b8; margin-bottom: 25px; font-weight: 500; }
        
        .video-container {
            position: relative;
            width: 850px;
            max-width: 100%;
            height: 480px; 
            margin: 0 auto;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .video-mask { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 30; background: transparent; }
        
        iframe { width: 100% !important; height: 480px !important; border: none; display: block; }
        
        /* Авто-растягивание плеера на весь экран */
        .video-container:fullscreen iframe,
        .video-container:fullscreen .video-mask,
        .video-container:-webkit-full-screen iframe,
        .video-container:-webkit-full-screen .video-mask,
        .video-container:-moz-full-screen iframe,
        .video-container:-moz-full-screen .video-mask,
        .video-container:-ms-fullscreen iframe,
        .video-container:-ms-fullscreen .video-mask {
            width: 100vw !important;
            height: 56.25vw !important;
            min-height: 100vh !important;
            min-width: 177.77vh !important;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .controls { margin-top: 20px; display: flex; justify-content: center; gap: 15px; }
        .btn {
            background-color: #0284c7; color: white; border: none; padding: 12px 24px;
            font-size: 1rem; font-weight: 600; cursor: pointer; border-radius: 8px;
            transition: all 0.2s ease; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .btn:hover { background-color: #0369a1; transform: translateY(-1px); }
        .online-counter {
            margin-top: 35px; font-size: 1.3rem; color: #94a3b8; background: #1e293b;
            display: inline-block; padding: 8px 20px; border-radius: 20px; border: 1px solid #334155;
        }
        .online-number { color: #22c55e; font-weight: bold; text-shadow: 0 0 10px rgba(34, 197, 94, 0.2); }
    </style>
</head>
<body>

    <h1>Ветер ТВ</h1>
    <div class="live-badge">Прямой эфир</div>
    <div class="subtitle" id="currentTrack">Загрузка эфира...</div>

    <div class="video-container" id="videoContainer">
        <div class="video-mask"></div>
        <iframe id="tv-player" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>

    <div class="controls">
        <button class="btn" id="muteBtn"> Lumix 🔇 Включить звук</button>
        <button class="btn" id="fullscreenBtn">📺 Полный экран</button>
    </div>

    <div class="online-counter">
        👀 Онлайн: <span class="online-number" id="onlineCount">Загрузка...</span> чел.
    </div>

    <script>
        // АВТОНОМНЫЙ СЧЁТЧИК КАЖДОЙ ОТКРЫТОЙ ВКЛАДКИ
        function initRealOnlineCounter() {
            const channel = new BroadcastChannel('vetertv_live_bus');
            const myTabId = Math.random().toString(36).substring(2, 11) + Date.now().toString(36);
            
            let activeTabs = {};
            activeTabs[myTabId] = Date.now();

            channel.onmessage = (event) => {
                if (event.data.type === 'ping' || event.data.type === 'pong') {
                    activeTabs[event.data.id] = Date.now();
                    updateUI();
                } else if (event.data.type === 'disconnect') {
                    delete activeTabs[event.data.id];
                    updateUI();
                }
            };

            function sendPing() {
                channel.postMessage({ type: 'ping', id: myTabId });
            }

            function updateUI() {
                const now = Date.now();
                for (let id in activeTabs) {
                    if (now - activeTabs[id] > 6000) {
                        delete activeTabs[id];
                    }
                }
                const totalCount = Object.keys(activeTabs).length;
                document.getElementById('onlineCount').textContent = totalCount;
            }

            window.addEventListener('beforeunload', () => {
                channel.postMessage({ type: 'disconnect', id: myTabId });
            });

            setInterval(() => {
                sendPing();
                updateUI();
            }, 2500);

            sendPing();
            updateUI();
        }

        initRealOnlineCounter();

        // НАСТРОЙКИ ПЛЕЕРА
        let isMuted = true;
        const p1 = "https://www.";
        const p2 = "youtube";
        const p3 = ".com/";
        const p4 = "embed/";

        function updateLiveBroadcast() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            
            const playerIframe = document.getElementById('tv-player');
            const muteParam = isMuted ? 1 : 0;

            let currentMovie = null;

            // ЖЕСТКОЕ РАСПИСАНИЕ ПО ЧАСАМ ТВОЕГО КОМПЬЮТЕРА
            // С 19:00 до 19:22 запускается Ниндзяго. (Когда найдешь оригинальный ID серии, вставь вместо 'AuMRLtc9o8E')
            if (hours === 19 && minutes >= 0 && minutes < 22) {
                currentMovie = { 
                    id: 'AuMRLtc9o8E', 
                    title: '🥷 ЛЕГО НИНДЗЯГО — Сезон 5 Серия 1 (Ветер перемен)',
                    startFrom: minutes * 60 + seconds
                };
            } 
            // В любое другое время — крутятся Три Кота
            else {
                currentMovie = { 
                    id: 'du97gvD2MzA', 
                    title: '🚁 ТРИ КОТА 🧳 ✈️ Про самолёты ☁️',
                    startFrom: (minutes % 45) * 60 + seconds
                };
            }

            if (currentMovie && playerIframe) {
                const movieUrl = p1 + p2 + p3 + p4 + currentMovie.id + `?autoplay=1&start=${currentMovie.startFrom}&mute=${muteParam}&controls=0&enablejsapi=1`;
                
                // Исправлено: Сверяем полную ссылку целиком, чтобы плеер никогда не зависал в бесконечной загрузке
                if (playerIframe.src !== movieUrl) {
                    playerIframe.src = movieUrl;
                    document.getElementById('currentTrack').textContent = 'Сейчас в эфире: ' + currentMovie.title;
                }
            }
        }

        // Запуск и синхронизация каждую секунду
        updateLiveBroadcast();
        setInterval(updateLiveBroadcast, 1000);

        // УПРАВЛЕНИЕ ЗВУКОМ
        document.getElementById('muteBtn').addEventListener('click', function() {
            const playerIframe = document.getElementById('tv-player');
            isMuted = !isMuted;
            
            if (isMuted) {
                this.innerHTML = " Lumix 🔇 Включить звук";
                if (playerIframe && playerIframe.contentWindow) {
                    playerIframe.contentWindow.postMessage('{"event":"command","func":"mute","args":""}', '*');
                }
            } else {
                this.innerHTML = "🔊 Выключить звук";
                if (playerIframe && playerIframe.contentWindow) {
                    playerIframe.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
                }
            }
            updateLiveBroadcast();
        });

        // УПРАВЛЕНИЕ ПОЛНЫМ ЭКРАНОМ
        document.getElementById('fullscreenBtn').addEventListener('click', function() {
            const container = document.getElementById('videoContainer');
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => {
                    alert(`Ошибка перехода в полный экран: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        });
    </script>
</body>
</html>
