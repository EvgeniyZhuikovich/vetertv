    <script>

        tag.src = "https://youtube.com";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var currentMediaId = '';
        var isManualMode = false;

        var mediaArchive = {
            'barboskiny':     { type: 'playlist', id: 'PL2w8GZscbpxuYd5mN64B98E28Xb5LwRk0' },
            'smeshariki':     { type: 'playlist', id: 'PL6K9_v7WZv1mZ04V6f3Vf2e3H1oZkX5U_' },
            'fixiki':         { type: 'video',    id: 'm4v9mY_LkoY' }, 
            'prostokvashino': { type: 'playlist', id: 'PL-7m6GvS4b5g8bO8KBlk7I_W_k-jS8b2p' },
            'tri_kota':       { type: 'playlist', id: 'PL67_XmSvvUGoL_8m8mB2K_N6rXU8sA4_w' },
            'music_block':    { type: 'playlist', id: 'PLMC9KNkIncKvYin_USF1qoJQn68Upw_YK' },
            'bars':           { type: 'video',    id: 'M_6m5O5F-m8' }
        };

        function checkSchedule() {
            if (isManualMode) return null;
            var now = new Date();
            var day = now.getDay(); 
            var hour = now.getHours();
            
            var showName = "ТЕХНИЧЕСКИЙ ПЕРЕРЫВ / ТВ ПОЛОСЫ";
            var nextName = "08:00 — Барбоскины";
            var mediaKey = "bars"; 

            if (hour >= 8 && hour < 22) {
                if (day >= 1 && day <= 5) {
                    if (hour >= 8 && hour < 10) { showName = "Барбоскины"; nextName = "10:00 — Смешарики"; mediaKey = "barboskiny"; }
                    else if (hour >= 10 && hour < 12) { showName = "Смешарики"; nextName = "12:00 — Фиксики"; mediaKey = "smeshariki"; }
                    else if (hour >= 12 && hour < 14) { showName = "Фиксики"; nextName = "14:00 — Простоквашино"; mediaKey = "fixiki"; }
                    else if (hour >= 14 && hour < 16) { showName = "Простоквашино"; nextName = "16:00 — Три кота"; mediaKey = "prostokvashino"; }
                    else if (hour >= 16 && hour < 17) { showName = "Три кота"; nextName = "17:00 — Музыкальный блок"; mediaKey = "tri_kota"; }
                    else if (hour >= 17 && hour < 18) { showName = "Музыкальный блок ОАО «Ветер»"; nextName = "18:00 — Барбоскины (Повтор)"; mediaKey = "music_block"; }
                    else if (hour >= 18 && hour < 19) { showName = "Барбоскины (Повтор)"; nextName = "19:00 — Смешарики"; mediaKey = "barboskiny"; }
                    else if (hour >= 19 && hour < 20) { showName = "Смешарики (Вечерний блок)"; nextName = "20:00 — Реклама"; mediaKey = "smeshariki"; }
                    else if (hour >= 20 && hour < 22) { showName = "Фирменные заставки и реклама"; nextName = "22:00 — ТВ Полосы"; mediaKey = "music_block"; }
                }
            }

            document.getElementById('current-show').innerText = "В ЭФИРЕ: " + showName;
            document.getElementById('next-show').innerText = "ДАЛЕЕ: " + nextName;
            return mediaArchive[mediaKey];
        }

        function onYouTubeIframeAPIReady() {
            var schedule = checkSchedule();
            currentMediaId = schedule.id;

            var playerConfig = {
                playerVars: { 'autoplay': 0, 'controls': 1, 'rel': 0, 'origin': window.location.origin }
            };

            if (schedule.type === 'playlist') {
                playerConfig.playerVars.listType = 'playlist';
                playerConfig.playerVars.list = schedule.id;
            } else {
                playerConfig.videoId = schedule.id;
            }

            player = new YT.Player('tv-player', playerConfig);

            setInterval(function() {
                if (isManualMode) return;
                var currentSchedule = checkSchedule();
                if (currentSchedule.id !== currentMediaId) {
                    currentMediaId = currentSchedule.id;
                    if (currentSchedule.type === 'playlist') {
                        player.loadPlaylist({ list: currentSchedule.id, listType: 'playlist' });
                    } else {
                        player.loadVideoById(currentSchedule.id);
                    }
                }
            }, 10000);
        }

        function startBroadcast() {
            if (player) { player.playVideo(); }
        }
