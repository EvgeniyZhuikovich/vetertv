<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВЕТЕР ТВ</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            color: #58a6ff;
            margin-bottom: 5px;
            font-size: 32px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .sub-title {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 40px;
            font-weight: 500;
        }

        /* Большая неоновая кнопка запуска ТВ */
        .play-tv-btn {
            display: inline-block;
            background-color: #e50914;
            color: #ffffff;
            text-decoration: none;
            padding: 20px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            box-shadow: 0 0 25px rgba(229, 9, 20, 0.7);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 50px;
            border: 2px solid #ff3333;
        }

        .play-tv-btn:hover {
            transform: scale(1.05);
            background-color: #ff1e27;
            box-shadow: 0 0 35px rgba(229, 9, 20, 0.9);
        }

        .footer-block {
            width: 90%;
            max-width: 854px;
            text-align: center;
        }

        .counter-box {
            padding: 15px;
            background: #161b22;
            border: 1px solid #21262d;
            border-radius: 8px;
            max-width: 350px;
            margin: 0 auto;
        }

        .counter-title {
            color: #8b949e;
            font-size: 13px;
            margin: 0 0 8px 0;
            font-weight: bold;
            letter-spacing: 1px;
        }

        #online-counter {
            color: #3fb950;
            font-size: 26px;
            font-weight: bold;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <h1>ВЕТЕР ТВ</h1>
    <div class="sub-title">Официальный сайт телеканала</div>

    <!-- ГЛАВНАЯ КНОПКА ВКЛЮЧЕНИЯ ТЕЛЕВИЗОРА -->
    <!-- Замени ссылку ниже на прямую ссылку своего Ютуб-канала или плейлиста со Смешариками -->
    <a href="https://youtube.com" target="_blank" class="play-tv-btn">
        🔴 ЗАПУСТИТЬ ЭФИР (YOUTUBE)
    </a>

    <!-- ЧИСТЫЙ СЧЕТЧИК ОНЛАЙНА -->
    <div class="footer-block">
        <div class="counter-box">
            <p class="counter-title">🔴 СЕЙЧАС СМОТРЯТ ВЕТЕР ТВ:</p>
            <span id="online-counter">1</span>
        </div>
    </div>

    <script>
        // Скрипт живого онлайна
        function simulateOnline() {
            let counter = document.getElementById('online-counter');
            if (!counter) return;
            let current = parseInt(counter.innerText);
            let change = Math.floor(Math.random() * 3) - 1; // -1, 0 или +1
            let newOnline = current + change;
            if (newOnline < 1) newOnline = 1;
            if (newOnline > 5) newOnline = 4;
            counter.innerText = newOnline;
        }
        setInterval(simulateOnline, 8000);
    </script>

</body>
</html>
